name: salzol native app (Go engine + Compose)

on:
  workflow_dispatch:
  push:
    paths:
      - "plugins/il-supermarket-compare/core/**"
      - "plugins/il-supermarket-compare/android/**"
      - ".github/workflows/salzol-native.yml"

env:
  APP: plugins/il-supermarket-compare
  NDK_VERSION: 27.1.12297006

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.APP }}/core/go.mod
          cache-dependency-path: ${{ env.APP }}/core/go.sum
      - name: Go tests (engine, AI, domain)
        working-directory: ${{ env.APP }}/core
        run: go test ./shop ./ai ./app ./droid
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Go engine as an Android library
        working-directory: ${{ env.APP }}/android
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          ./build-go.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app
        working-directory: ${{ env.APP }}/android
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ${{ env.APP }}/android/e2e.sh
      - name: Upload screenshots, logs and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salzol-native
          path: |
            ${{ env.APP }}/android/out/
            ${{ env.APP }}/android/app/build/outputs/apk/release/app-release.apk
