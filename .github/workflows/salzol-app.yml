# Tests for the סל זול app (plugins/il-supermarket-compare): Go engine and app unit tests, an
# Android emulator end-to-end run.
#
# GitHub's runners are outside Israel, so the chains that block foreign addresses (Victory,
# Carrefour, Hazi Hinam, Mahsanei HaShuk) still can't be reached from here.
name: salzol app

on:
  push:
    paths:
      - "plugins/il-supermarket-compare/**"
      - ".github/workflows/salzol-app.yml"
  pull_request:
    paths:
      - "plugins/il-supermarket-compare/**"
      - ".github/workflows/salzol-app.yml"
  workflow_dispatch:

concurrency:
  # One run per branch: a push and its pull_request event share the group.
  group: salzol-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP: plugins/il-supermarket-compare
  NDK_VERSION: 27.1.12297006

jobs:
  unit:
    name: Go and app unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.APP }}/core/go.mod
          cache-dependency-path: ${{ env.APP }}/core/go.sum
      - name: Go vet and tests
        working-directory: ${{ env.APP }}/core
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP }}/mobile/package-lock.json
      - name: App type check and tests
        working-directory: ${{ env.APP }}/mobile
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm test

  android-e2e:
    name: Android emulator end-to-end
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.APP }}/core/go.mod
          cache-dependency-path: ${{ env.APP }}/core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP }}/mobile/package-lock.json
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build the Go engine for Android (gomobile)
        working-directory: ${{ env.APP }}/mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          bash scripts/build-go.sh android
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app (x86_64, for the emulator)
        working-directory: ${{ env.APP }}/mobile
        run: |
          npm ci --no-audit --no-fund
          CI=1 npx expo prebuild -p android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain
          ls -la app/build/outputs/apk/release/
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the end-to-end flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ${{ env.APP }}/mobile/e2e/run.sh
      - name: Upload screenshots, logs and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: |
            ${{ env.APP }}/mobile/e2e/out/
            ${{ env.APP }}/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
